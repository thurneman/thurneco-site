function pxRecordCall(id,label,withdraw){
  const m=matches.get(id);

  const own=pxCallNotes(m).filter(q=>q.av===userId && q.kravSamtal.krav===label).map(q=>q.id);
  if(withdraw!==Boolean(own.length)){renderDetail();return;}
  const title=withdraw?"Återta min bekräftelse":"Bekräfta efter samtal";
  const {bg,close}=modal(title,`<p>${t(label)}</p><form><label>Källanteckning<textarea required maxlength="1000" name="source" placeholder="Vem talade du med, när och vad framkom?"></textarea></label>
    <p role="alert" class="cerr"></p><div class="acts"><button type="submit" class="btn">Spara i historiken</button><button type="button" class="tbtn" data-close>Avbryt</button></div></form>`);
  const form=bg.querySelector("form"),note=form.elements.source;
  const actor=userId,version=pxNoteVersion(roles.get(m.roleId));

  form.addEventListener("submit",async e=>{
    e.preventDefault();
    const current=matches.get(id),source=note.value.trim(),err=form.querySelector('[role="alert"]');
    if(bg.dataset.busy || !source)return;
    if(!current || current.roleId!==m.roleId || current.candId!==m.candId || !pxCanNote(current) || userId!==actor || pxNoteVersion(roles.get(m.roleId))!==version || !pxListedRequirements(roles.get(m.roleId)?.brief).includes(label)){
      err.textContent="Kravet eller åtkomsten har ändrats. Öppna kortet igen.";return;
    }
    // Keep the event immutable and reuse its identifier if a prior acknowledgement was lost.
    if(!doc){
      const req={version:1,handling:withdraw?"aterkalla":"bekrafta",krav:label,kalla:source,kravVersion:version};
      if(withdraw)req.poster=own;
      doc={matchId:id,roleId:m.roleId,candId:m.candId,av:actor,namn:userName||"Partner",at:nowIso(),synkad:false,kravSamtal:req,
        text:(withdraw?"Återkallad samtalsbekräftelse":"Bekräftat i samtal")+(version===null?"":" · kravversion "+version)+" · "+label+"\nKälla: "+source};
    }
    bg.dataset.busy="1";note.readOnly=true;const btn=form.querySelector('[type="submit"]');btn.disabled=true;
    try{
      const ref=db.doc("kommentarer/"+idComment);
      const prior=await ref.get();
      if(!prior.exists)await ref.set(doc);
      const saved=prior.exists?prior:await ref.get(),d=saved.exists?saved.data():null;
      if(!d || d.matchId!==doc.matchId || d.roleId!==doc.roleId || d.candId!==doc.candId || d.av!==doc.av || d.at!==doc.at
        || d.text!==doc.text || d.kravSamtal?.version!==1 || d.kravSamtal.kravVersion!==version || d.kravSamtal?.handling!==doc.kravSamtal.handling || d.kravSamtal.krav!==label || d.kravSamtal.kalla!==source
        || (withdraw && (!Array.isArray(d.kravSamtal.poster) || d.kravSamtal.poster.length!==own.length || !own.every(x=>d.kravSamtal.poster.includes(x)))))throw Error("återläsning");
      comments.set(idComment,{...d,id:idComment});close();renderDetail();
      toast(pxNoteVersion(roles.get(m.roleId))===version?"Sparat i Historik.":"Sparat i Historik för den tidigare kravversionen.");
    }catch{
      delete bg.dataset.busy;btn.disabled=false;btn.textContent="Kontrollera och försök igen";err.textContent="Anteckningen kunde inte bekräftas. Kontrollera och försök igen med samma anteckning.";
    }
  });
}

function partnerPublicProfileUrl(c){
  if(!c || c.linkedinVisible===false || typeof c.linkedin!=="string")return "";
  const raw=c.linkedin.trim();
  if(!/^https:\/\/(?:(?:www|[a-z]{2})\.)?linkedin\.com\/in\/[^/?#]+\/?$/iu.test(raw)||/[\\\u0000-\u001f\u007f?#]/u.test(raw))return "";
  try{
    const url=new URL(raw);
    if(url.username||url.password||url.port||!/^(?:(?:www|[a-z]{2})\.)?linkedin\.com$/i.test(url.hostname))return "";
    const path=decodeURIComponent(url.pathname);
    if(!/^\/in\/[\p{L}\p{M}\p{N}_-]+\/?$/u.test(path))return "";
    return url.origin+url.pathname;
  }catch{return "";}
}

// Keep only references and per-view scroll positions. Labels always come from the current partner snapshots.
const workTabs = new Map();
let workTabActor = "", activeWorkTab = "", applyingExternalRoute = false;

function workHash(kind,id){
  const route={role:"uppdrag",match:"kandidat",person:"profil"};
  return "#"+route[kind]+"="+encodeURIComponent(id);
}
function workLabel(kind,id){
  if(!recentMayRead())return "";
  if(kind==="role"){
    const r=roles.get(id);
    return pxVisibleDetailRole(id)?pxRoleName(r):"";
  }
  if(kind==="person")return cands.get(id)?.name||"";
  const m=matches.get(id);
  return m&&pxVisibleDetailRole(m.roleId)&&cands.has(m.candId)?cands.get(m.candId).name||m.candName||"Konsult":"";
}
function retainWorkTab(kind,id){
  if(!workLabel(kind,id))return "";
  const key=kind+":"+id;
  if(!workTabs.has(key))workTabs.set(key,{kind,id,top:0,pageTop:0});
  return key;
}
function rememberWorkPosition(){
  const tab=workTabs.get(activeWorkTab);
  if(!tab)return;
  tab.top=$("#detail").scrollTop;
  tab.pageTop=window.scrollY;
  if(tab.kind==="match" && fTab.id===tab.id)tab.panel=fTab.tab;
}
function drawWorkTabs(){
  const actor=String(userId||"")+"|"+String(window.ATS_RUNTIME?.visaSom?.()||"");
  if(actor!==workTabActor||!recentMayRead()){
    workTabs.clear();activeWorkTab="";workTabActor=actor;
  }
  const strip=$("#case-tabs");
  const html=[];
  for(const [key,tab] of workTabs){
    const label=workLabel(tab.kind,tab.id);
    if(!label){workTabs.delete(key);continue;}
    const current=key===activeWorkTab?' aria-current="page"':"";
    html.push('<span class="case-tab" data-kind="'+tab.kind+'"><a href="'+esc(workHash(tab.kind,tab.id))+'" data-work-tab="'+esc(key)+'"'+current+'>'+t(label)+'</a><button type="button" data-close-work="'+esc(key)+'" aria-label="Stäng '+esc(label)+'">×</button></span>');
  }
  const next=html.join("");
  if(strip._lastMarkup!==next){strip.innerHTML=next;strip._lastMarkup=next;}
  strip.hidden=!html.length;
}
function prepareWorkTab(kind,id){
  const previousKey=activeWorkTab;
  rememberWorkPosition();
  if(!previousKey && !location.hash && !applyingExternalRoute){
    try{history.replaceState({...history.state,partnerView:view},"",location.href);}catch{}
  }
  if(kind==="match")retainWorkTab("role",matches.get(id).roleId);
  activeWorkTab=retainWorkTab(kind,id);
  const target=workTabs.get(activeWorkTab);
  if(target && kind==="person" && !target.originKey && previousKey && previousKey!==activeWorkTab)target.originKey=previousKey;
  if(target && kind==="match")fTab={id,tab:target.panel||null};
  const hash=workHash(kind,id);
  if(!applyingExternalRoute && location.hash!==hash){
    try{history.pushState(null,"",hash);}catch{}
  }
}
function restoreWorkPosition(){
  const key=activeWorkTab,tab=workTabs.get(key);
  if(!tab)return;
  $("#detail").scrollTop=tab.top;
  if(window.scrollY!==tab.pageTop)window.scrollTo(0,tab.pageTop);
  const current=$("#case-tabs [aria-current=page]"),strip=$("#case-tabs");
  if(current && (current.offsetLeft<strip.scrollLeft || current.offsetLeft+current.offsetWidth>strip.scrollLeft+strip.clientWidth))
    strip.scrollLeft=Math.max(0,current.offsetLeft-strip.clientWidth/2);
}
function visitWorkTab(tab){
  if(!tab||!workLabel(tab.kind,tab.id))return;
  if(tab.kind==="role")openRole(tab.id);
  else if(tab.kind==="match")openMatch(tab.id);
  else openCand(tab.id);
}
function backgroundWorkTab(target){
  const el=target.closest?.("[data-openm],[data-openr],[data-opencand]");
  if(!el)return false;
  const kind=el.hasAttribute("data-openm")?"match":el.hasAttribute("data-openr")?"role":"person";
  const id=el.dataset.openm||el.dataset.openr||el.dataset.opencand;
  if(!workLabel(kind,id))return false;
  if(kind==="match")retainWorkTab("role",matches.get(id).roleId);
  retainWorkTab(kind,id);drawWorkTabs();return true;
}
document.addEventListener("auxclick",e=>{
  if(e.button===1 && backgroundWorkTab(e.target))e.preventDefault();
});
document.addEventListener("click",e=>{
  if((e.ctrlKey||e.metaKey) && backgroundWorkTab(e.target)){
    e.preventDefault();e.stopPropagation();
  }
},true);
$("#case-tabs").addEventListener("click",e=>{
  const link=e.target.closest("[data-work-tab]");
  if(link){
    if(e.ctrlKey||e.metaKey||e.shiftKey||e.altKey)return;
    e.preventDefault();visitWorkTab(workTabs.get(link.dataset.workTab));return;
  }
  const close=e.target.closest("[data-close-work]");
  if(!close)return;
  const key=close.dataset.closeWork, tab=workTabs.get(key);
  if(!tab)return;
  const previous=[...workTabs.keys()].slice(0,[...workTabs.keys()].indexOf(key)).pop();
  workTabs.delete(key);
  if(key!==activeWorkTab){drawWorkTabs();return;}
  activeWorkTab="";
  const next=workTabs.get(previous)||[...workTabs.values()][0];
  if(next)visitWorkTab(next);else setView("uppdrag");
});

// Arbetsdag använder endast de uppdrag, personer, matchningar och besked som redan är inlästa för partnern.
const Arbetsdag = (() => {
  const dayMs=86400000;
  const isoDay=value=>typeof value==="string" && /^\d{4}-\d{2}-\d{2}$/.test(value)
    && !Number.isNaN(Date.parse(value+"T12:00:00Z")) && new Date(value+"T12:00:00Z").toISOString().startsWith(value);
  function dateValue(value) {
    if(typeof value!=="string" || !/^\d{4}-\d{2}-\d{2}T/.test(value))return 0;
    const t=Date.parse(value);return Number.isFinite(t)?t:0;
  }
  function months(period) {
    if(typeof period!=="string")return 0;
    const exact=/^(\d{1,2})\s*(?:mån|månader)\.?$/i.exec(period.trim());
    if(exact)return Number(exact[1]);
    const range=/^(\d{4}-\d{2}-\d{2})\s*(?:–|—|\s-\s|till)\s*(\d{4}-\d{2}-\d{2})$/.exec(period.trim());
    if(!range || !isoDay(range[1]) || !isoDay(range[2]) || range[2]<range[1])return 0;
    const [sy,sm,sd]=range[1].split("-").map(Number);
    const end=new Date(Date.parse(range[2]+"T00:00:00Z")+dayMs);
    return (end.getUTCFullYear()-sy)*12+end.getUTCMonth()+1-sm-(end.getUTCDate()<sd?1:0);
  }
  function latestCv(c,m,cvRow,now,visiblePairs=[]) {
    if(cvRow?.assetId || [cvRow?.url,c.cv].some(v=>typeof v==="string" && /^https?:\/\//i.test(v)))return "finns";
    if(c.cv || cvRow?.url || cvRow?.filnamn)return "okänt";
    // Fritext kan hänvisa till en fil i en tråd som inte syns på kortet.
    // Enbart ett uttryckligt, daterat besked från kandidaten får ge uppgiften Hämta in CV.
    const answer=m.svar||{},at=dateValue(answer.at);
    const explicit=/^(?:jag (?:har inget aktuellt cv|saknar ett aktuellt cv)|mitt cv är inte klart|jag (?:skickar|återkommer med) (?:ett |mitt )?(?:aktuellt )?cv (?:senare|i morgon|imorgon))[.!]?$/i;
    if(!at || at>now || !explicit.test(String(answer.text||"").trim()))return "okänt";
    for(const k of Array.isArray(c.kontakter)?c.kontakter:[]){
      if(!k || !/\bcv\b|bifog|bilag|pdf/i.test(String(k.text||"")))continue;
      if(k.roleId===m.roleId && dateValue(k.at)===at && String(k.text||"").trim()===answer.text.trim())continue;
      if(!dateValue(k.at) || dateValue(k.at)>=at)return "okänt";
    }
    for(const other of visiblePairs){
      if(other.candId!==c.id)continue;
      for(const [text,date] of [[other.svar?.text,other.svar?.at],[other.nextStep,other.nextAt]]){
        if(typeof text!=="string" || !/\bcv\b|bifog|bilag|pdf/i.test(text))continue;
        if(other.id===m.id && dateValue(date)===at && text.trim()===answer.text.trim())continue;
        if(!dateValue(date)||dateValue(date)>=at)return "okänt";
      }
    }
    // Ett senare skeende utan verifierad CV-status kräver en ny kontroll.
    const other=[m.stageAt,m.nextAt,m.updatedAt,c.updatedAt];
    if(other.some(stamp=>dateValue(stamp)>at))return "okänt";

  }

const SenastInkomna=(()=>{
  const dated=new Intl.DateTimeFormat("sv-SE",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",timeZone:"Europe/Stockholm"});
  function createdTime(value,now){
    if(typeof value!=="string")return null;
    const m=/^(\d{4})-(\d\d)-(\d\d)T(\d\d):(\d\d):(\d\d)(?:\.\d{1,6})?(?:Z|[+-]\d\d:\d\d)$/.exec(value);
    if(!m)return null;
    const [year,month,day,hour,minute,second]=m.slice(1).map(Number),stamp=Date.parse(value);
    if(!Number.isFinite(stamp) || stamp>now || month<1 || month>12 || day<1 ||
      day>new Date(Date.UTC(year,month,0)).getUTCDate() || hour>23 || minute>59 || second>59)return null;
    return stamp;
  }
  function entries(rows,now,allow){
    const known=[],unknown=[];
    if(!(rows instanceof Map) || typeof allow!=="function")return {known,unknown};
    for(const [id,r] of rows){
      if(!r || typeof id!=="string" || !id || r.id!==id || typeof r.title!=="string" || !r.title.trim() || !allow(r))continue;
      const stamp=createdTime(r.createdAt,now),entry={id,title:r.title,stamp};
      (stamp===null?unknown:known).push(entry);
    }
    const byName=(a,b)=>a.title.localeCompare(b.title,"sv")||a.id.localeCompare(b.id,"sv");
    known.sort((a,b)=>b.stamp-a.stamp||byName(a,b));unknown.sort(byName);
    return {known,unknown};
  }
  function format(stamp){return dated.format(stamp);}
  return {entries,format};
})();

  for (const row of data.roles) {

async function pxTeamLoad(force=false) {

  }
  const old = pxTeamState;
  if (old.actor === actor && !force && old.phase !== "idle") return old.phase === "ready";
  if (old.actor === actor && old.request && !force) return false;
  const request = {};
  const state = old.actor === actor ? old : {actor,phase:"idle",rows:new Map()};
  if (state.phase === "idle") state.phase = "loading";
  state.request = request;

  try {
    const reply = await window.ATS_RUNTIME.rpc("partner_team_arbetsdag",{});
    if (reply?.error) throw reply.error;

    const same = state.phase === data.phase && state.rows.size === data.rows.size &&
      [...data.rows].every(([id,row]) => {

function pxTeamCard(id){

      const choice=rejected?"nej":card.besked;

function pxRoleVersion(id){

function pxRoleEvidence(id){
  const unknown={source:"unknown",choice:null,current:false};
  if(!pxJobVisible(roles.get(id)) || !recentMayRead())return unknown;
  const actor=pxWorkActor(),own=actor && pxRoleState.actor===actor && pxRoleState.phase==="ready";
  if(actor && pxRoleState.actor===actor && !own){

  }
  if(actor && (pxRoleState.actor!==actor || ["idle","loading","error"].includes(pxRoleState.phase)))return unknown;
  const previous=own && pxRoleState.values.get(id),version=pxRoleVersion(id);

}

function pxJobBody(){

  const personal=!!pxWorkActor() && arbetsdagRead.has("bedomningar") && !arbetsdagFailed.has("bedomningar");

  return '<div class="px-j-totals"><p><strong>'+all.length+'</strong> uppdrag · <strong>'+populated+'</strong> med konsulter</p></div>'+

}

// ===== Deadline: dubbelklick öppnar ett datumfält ovanpå etiketten. Två klick inom 450 ms räknas också, eftersom listan ritas om vid första klicket.
function openDeadlineEditor(el){
  if(!el||!canWrite)return;const r=roles.get(el.dataset.dl);if(!r)return;
  document.querySelectorAll(".dl-pop").forEach(x=>x.remove());
  const d=effDeadline(r);const box=el.getBoundingClientRect();
  const pop=document.createElement("div");pop.className="dl-pop";pop.style.top=`${window.scrollY+box.bottom+4}px`;pop.style.left=`${window.scrollX+Math.max(8,Math.min(box.left,window.innerWidth-330))}px`;
  const inp=document.createElement("input");inp.type="date";inp.setAttribute("aria-label","Sista inskickningsdag för "+(r.title||r.id));if(d.ymd)inp.value=d.ymd;
  const ok=document.createElement("button");ok.type="button";ok.className="btn small";ok.textContent="Spara";
  const no=document.createElement("button");no.type="button";no.className="btn small light";no.textContent="Avbryt";
  pop.append(inp,ok,no);document.body.appendChild(pop);
  for(const ev of["click","mousedown","dblclick"])pop.addEventListener(ev,x=>x.stopPropagation());
  let done=false;const finish=async save=>{if(done)return;done=true;if(!(save&&inp.value)){pop.remove();return;}{const[Y,M,D]=inp.value.split("-").map(Number);const text=`${D} ${MONTHS[M-1]} ${Y}`;const okk=await saveAndring(r.id,{deadline:text,deadlineYmd:inp.value,deadlineSattAt:nowIso(),deadlineSattAv:userId,deadlineSattAvNamn:userName});if(!okk){done=false;return;}pop.remove();toast(`Sista inskickningsdag satt: ${text}. Synkas till huvudregistret inom en timme.`);render();}};
  ok.addEventListener("click",()=>finish(true));no.addEventListener("click",()=>finish(false));
  inp.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();finish(true);}else if(ev.key==="Escape"){ev.preventDefault();finish(false);}});
  const away=ev=>{if(!pop.contains(ev.target)){document.removeEventListener("mousedown",away,true);finish(false);}};
  setTimeout(()=>document.addEventListener("mousedown",away,true),0);
  inp.focus();
}

async function placeOrder(m,c,instr,annons){
  if(!db||!userId)return{ok:false,msg:"Ingen inloggad identitet, beställningen går inte att knyta till dig."};

    if(cur&&(OPEN.has(cur.status)||cur.status==="skickat"||cur.status==="svar"))return{ok:false,msg:"det finns redan en beställning."};
    const now=nowIso();
    const entry={candId:m.candId,candName:c.name||m.candName||"",roleId:m.roleId,matchId:m.id,instruktion:instr,annonslank:annons||"nej",at:now,konto:"recruiter-filip",kravGodkannande:false,go:{status:"ja",via:"staende-go-konsult",av:userId,avNamn:userName,at:now},status:"bestalld",statusAt:now,statusAv:userId,bestallare:userId,bestallareNamn:userName,kalla:"konsult-ats",kvittens:null,fel:""};
    if(snap.exists)await ref.update({poster:{[k]:entry},updatedAt:now});
    else await ref.set({bestallare:userId,bestallareNamn:userName,kalla:"konsult-ats",poster:{[k]:entry},createdAt:now,updatedAt:now});
    const check=await ref.get();const saved=check.exists&&check.data().poster&&check.data().poster[k];
    if(!saved||saved.at!==now)return{ok:false,msg:"gick inte att bekräfta vid återläsning."};

function underlagText(m){
  const c=cands.get(m.candId)||{};const r=roles.get(m.roleId)||{};const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
  const L=[`Kandidat: ${c.name||m.candName||""}`,`Uppdrag: ${r.title||"Uppdrag utan titel"}`,`Stadie: ${STAGE[stageOf(m)]||stageOf(m)}`,""];
  L.push("BEKRÄFTAT",...(arr(m.belagt).length?arr(m.belagt).map(x=>"- "+x):["- inget registrerat"]),"");
  L.push("ATT VERIFIERA",...(arr(m.verifiera).length?arr(m.verifiera).map(x=>"- "+x):["- inget registrerat"]),"");
  if(arr(m.saknas).length)L.push("SAKNAS",...arr(m.saknas).map(x=>"- "+x),"");
  L.push(`Praktiskt: ${m.praktiskt||"ej registrerat"}`,`Tillgänglig: ${c.tillganglig||"ej registrerat"}`,`Bolagsform: ${BOLAG[c.bolagsform]||"ej registrerat"}`);
  const pub=typeof partnerPublicProfileUrl==="function"?partnerPublicProfileUrl(c):"";if(pub)L.push(`LinkedIn: ${pub}`);
  const ct=contactOf(c);if(ct.phone)L.push(`Telefon: ${ct.phone}`);if(ct.email)L.push(`Mejl: ${ct.email}`);
  return neutral(L.join("\n"));
}

(async()=>{
  const use=n=>(window.claude&&typeof window.claude.use==="function")?window.claude.use(n):Promise.resolve(null);
  db=await use("db");const user=await use("user");
  if(!db){setSync("Ingen databas i den här vyn. Logga in eller öppna sidan på nytt.",true);$("#detail").innerHTML=`<div class="empty">Databasen kan inte nås i den här vyn.</div>`;return;}
  try{userId=user?await user.id():null;isOwner=user?await user.isOwner():false;canAdmin=user&&typeof user.canEdit==="function"?await user.canEdit():false;const me=user?await user.me():null;userName=(me&&me.name)||"";userEmail=String((me&&me.email)||"").toLowerCase();if(userId && me?.id===userId && me.isOwner===false && me.canEdit===false && isOwner===false && canAdmin===false && await user.can("data.write")===true && !window.ATS_RUNTIME?.visaSom?.())arbetsdagActor=userId;}catch{}
  const w=user?await user.can("data.write"):null;canWrite=w!==false&&!!userId&&!window.ATS_RUNTIME?.visaSom?.();
  assets=canWrite?await use("assets"):null;
  $("#who").textContent=userName?`Inloggad: ${userName}`:(isOwner?"Inloggad som ägare":"");
  try{selected=localStorage.getItem("konsult.selected")||null;view="lista";}catch{}
  let got=0;const ALL=1|2|4;let deepDone="";const done=()=>{if((got&ALL)===ALL){if(pxWorkActor() && (pxRoleState.actor!==pxWorkActor()||pxRoleState.phase==="idle"))void pxLoadChoices();setSync(`Synkad ${new Date().toLocaleTimeString("sv-SE",{timeZone:TZ,hour:"2-digit",minute:"2-digit"})}`);applyDeepLink();}};
  // Djuplänkar från Ping-budets mail: #uppdrag=<roleId> eller #kandidat=<roleId>__<candId>
  function applyDeepLink(fromHistory=false){
    if((got&ALL)!==ALL)return;
    const hash=location.hash;
    if(!hash){
      if(fromHistory){applyingExternalRoute=true;try{const v=history.state?.partnerView;setView(["lista","konsulter","sok","skapa","uppdrag"].includes(v)?v:"uppdrag");}finally{applyingExternalRoute=false;}}
      deepDone="";return;
    }
    let val;
    try{val=decodeURIComponent(hash.slice(1));}catch{return;}
    const mm=/^(uppdrag|kandidat|profil)=([^#\x00-\x1f]{1,320})$/.exec(val);
    if(!mm||!fromHistory&&(deepDone===hash||workTabs.has(activeWorkTab)&&workHash(workTabs.get(activeWorkTab).kind,workTabs.get(activeWorkTab).id)===hash))return;
    deepDone=hash;applyingExternalRoute=true;
    try{
      const kind=({uppdrag:"role",kandidat:"match",profil:"person"})[mm[1]];
      if(workLabel(kind,mm[2]))visitWorkTab({kind,id:mm[2]});
      else toast("Kortet finns inte i din vy.");
    }finally{applyingExternalRoute=false;}
  }
  window.addEventListener("hashchange",()=>applyDeepLink(true));
  const timer=setTimeout(()=>{if((got&ALL)!==ALL)setSync("Data kan inte nås ännu. Det som visas kan vara inaktuellt.",true);},10000);
  const fail=what=>e=>{const key=({uppdrag:"roles",kandidater:"candidates",matchningar:"matches",ändringar:"ändringar",CV:"CV",bedömningar:"bedomningar"})[what];if(key){arbetsdagFailed.add(key);if(["lista","uppdrag","rollkort"].includes(view))renderDetail();}setSync(`Fel vid läsning av ${what} (${e&&e.code||"okänt"})`,true);};
  const toMap=s=>new Map(s.docs.filter(d=>d.exists).map(d=>[d.id,{id:d.id,...d.data()}]));
  db.collection("roles").onSnapshot(s=>{arbetsdagRead.add("roles");arbetsdagFailed.delete("roles");roles=toMap(s);if(selected&&!roles.has(selected))selected=null;if(!selected){const v=visibleRoles();selected=v[0]?.id||null;}got|=1;render();done();},fail("uppdrag"));
  db.collection("candidates").onSnapshot(s=>{arbetsdagRead.add("candidates");arbetsdagFailed.delete("candidates");cands=toMap(s);got|=2;render();done();},fail("kandidater"));
  db.collection("matches").onSnapshot(s=>{arbetsdagRead.add("matches");arbetsdagFailed.delete("matches");matches=toMap(s);got|=4;render();done();},fail("matchningar"));
  db.collection("kommentarer").onSnapshot(s=>{pxCommentsReady=true;comments=toMap(s);renderDetail();resolveNames(user);},e=>{pxCommentsReady=false;fail("kommentarer")(e);renderDetail();});
  db.collection("partnersvar").onSnapshot(s=>{arbetsdagRead.add("partnersvar");arbetsdagFailed.delete("partnersvar");svarP=toMap(s);renderDetail();},()=>{arbetsdagFailed.add("partnersvar");if(view==="lista")renderDetail();});
  db.collection("andringar").onSnapshot(s=>{arbetsdagRead.add("ändringar");arbetsdagFailed.delete("ändringar");andr=toMap(s);render();},fail("ändringar"));
  db.collection("cv").onSnapshot(s=>{arbetsdagRead.add("CV");arbetsdagFailed.delete("CV");cvs=toMap(s);renderDetail();},fail("CV"));
  db.collection("searchbegaran").onSnapshot(s=>{sreq=toMap(s);render();},fail("searchbegäran"));
  genLadda();
  db.collection("bedomningar").onSnapshot(s=>{arbetsdagRead.add("bedomningar");arbetsdagFailed.delete("bedomningar");bed=bedMap(s);render();},fail("bedömningar"));
  db.collection("kontaktuppgifter").onSnapshot(s=>{kuppg=toMap(s);renderDetail();},fail("kontaktuppgifter"));
  db.collection("egna").onSnapshot(s=>{egna=toMap(s);render();},fail("egna kandidater"));
  db.collection("pingar").onSnapshot(s=>{pings=toMap(s);renderDetail();},()=>{});
  db.collection("matchbegaran").onSnapshot(s=>{mreq=toMap(s);renderDetail();},()=>{});
  const ordErr=e=>{ordersState="fel";ordersErr=e&&e.code||"okänt";setSync(`Beställningsstatus kunde inte läsas (${ordersErr})`,true);renderDetail();};
  if(isOwner||canAdmin)db.collection("kontaktbestallningar").onSnapshot(s=>{orders={};for(const d of s.docs)if(d.exists)orders[d.id]=d.data();ordersState="ok";render();},ordErr);
  else if(userId)db.doc("kontaktbestallningar/"+userId).onSnapshot(s=>{orders=s.exists?{[userId]:s.data()}:{};ordersState="ok";render();},ordErr);
  else{ordersState="fel";ordersErr="ingen identitet";renderDetail();}
  void timer;
})();
