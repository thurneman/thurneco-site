<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// leverantörsnamnet visas aldrig i gränssnittet, datan rörs inte
const neutral=s=>String(s==null?"":s).replace(/talendary/gi,"Search");
const t=s=>esc(neutral(s));
const nowIso=()=>new Date().toISOString();
const toast=m=>{const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.append(e);setTimeout(()=>e.remove(),3600);};
const setSync=(m,err)=>{const e=$("#sync");e.textContent=m;e.className=err?"err":"";};
const TZ="Europe/Stockholm";
const fmt=iso=>{if(!iso)return"";const d=new Date(iso);return isNaN(d)?esc(iso):d.toLocaleString("sv-SE",{timeZone:TZ,day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});};
const fmtDay=iso=>{if(!iso)return"";const d=new Date(iso);return isNaN(d)?esc(iso):d.toLocaleDateString("sv-SE",{timeZone:TZ,day:"numeric",month:"short"});};
const STAGE={matchad:"Matchad",ansokt:"Ansökt",kontaktad:"Kontaktad",intresserad:"Intresserad",presenterad:"Presenterad",intervju:"Intervju",erbjudande:"Erbjudande",avslutad:"Avslutad"};
const ARCHIVED=new Set(["utgangen","stoppad","forlorad","tillsatt","vunnen"]);
const STATUS_LABEL={ny:"Ny",pagar:"Pågår",presenterad:"Presenterad",vunnen:"Vunnen",tillsatt:"Tillsatt",forlorad:"Förlorad",stoppad:"Stoppad",utgangen:"Utgången"};
const BOLAG={eget:"Eget bolag",anstalld:"Anställd",underkonsult:"Underkonsult"};
const MONTHS=["januari","februari","mars","april","maj","juni","juli","augusti","september","oktober","november","december"];

let db=null,assets=null,userId=null,userName="",isOwner=false,canAdmin=false,canWrite=false;
let roles=new Map(),cands=new Map(),matches=new Map(),comments=new Map(),orders={},andr=new Map(),cvs=new Map(),sreq=new Map(),bed=new Map(),kuppg=new Map(),egna=new Map(),pings=new Map(),mreq=new Map();
// Kontaktuppgifter som partnern själv lagt in. Visas och skrivs här, synkas till huvudregistret. Huvudregistrets egna telefon och mejl synkas inte hit.
const CF_EXTRA=[["linkedin","LinkedIn","url"],["tillganglig","Tillgänglig","text"],["timpris","Timpris","text"],["bolagsform","Bolagsform","text"]];
const CF_LABEL={phone:"Telefon",email:"Mejl",linkedin:"LinkedIn",tillganglig:"Tillgänglighet",timpris:"Timpris",bolagsform:"Bolagsform",anteckning:"Anteckning"};
const contactOf=c=>{const k=kuppg.get(c.id)||{};const v=f=>String(k[f]!=null&&k[f]!==""?k[f]:(c[f]||""));return{phone:v("phone"),email:v("email"),linkedin:v("linkedin"),tillganglig:v("tillganglig"),timpris:v("timpris"),bolagsform:v("bolagsform"),anteckning:String(k.anteckning||""),at:k.at,avNamn:k.avNamn};};
let ordersState="laddar",ordersErr="";
let view="uppdrag",selected=null,query="",sokQuery="",showArch=false,procPick={},focusPick={},fTab={id:null,tab:null},candSel=null,backView="konsulter";
const drafts={};   // utkast per matchning och uppdrag, töms först efter bekräftad sparning
try{Object.assign(drafts,JSON.parse(sessionStorage.getItem("konsult.drafts")||"{}"));}catch{}
const saveDrafts=()=>{try{sessionStorage.setItem("konsult.drafts",JSON.stringify(drafts));}catch{}};
const commentErr={};

// ===== Deadline = sista inskickningsdag, i svensk tid. Partnerns egen ändring (andringar) gäller före den synkade tills synken hämtat den.
const MON={januari:1,februari:2,mars:3,april:4,maj:5,juni:6,juli:7,augusti:8,september:9,oktober:10,november:11,december:12};
const pad=n=>String(n).padStart(2,"0");
function ymdOf(s){s=String(s||"").toLowerCase();let m=s.match(/(\d{1,2})\s+([a-zåäö]+)\s+(\d{4})/);if(m&&MON[m[2]])return`${m[3]}-${pad(MON[m[2]])}-${pad(+m[1])}`;m=s.match(/(\d{4})-(\d{2})-(\d{2})/);return m?`${m[1]}-${m[2]}-${m[3]}`:null;}
function effDeadline(r){const a=andr.get(r.id);if(a&&a.deadline&&(a.synkad===false||(a.deadlineSattAt||"")>(r.deadlineSattAt||"")))return{text:a.deadline,ymd:ymdOf(a.deadline),egen:true,at:a.deadlineSattAt};return{text:r.deadline||"",ymd:ymdOf(r.deadline),egen:false};}
const todayYmd=()=>new Intl.DateTimeFormat("sv-SE",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
const isPassed=r=>{const y=effDeadline(r).ymd;return !!y&&y<todayYmd();};
function daysLeft(y){if(!y)return null;const a=new Date(todayYmd()+"T12:00:00Z"),b=new Date(y+"T12:00:00Z");return Math.round((b-a)/86400000);}
function dayLabel(y){const[Y,M,D]=y.split("-").map(Number);return`${D} ${MONTHS[M-1].slice(0,3)}.`;}
function daysHTML(r){
  const d=effDeadline(r);const open=!ARCHIVED.has(r.status);
  const edit=canWrite&&open?` data-dl="${esc(r.id)}" title="Sista inskickningsdag. Dubbelklicka för att ändra.${d.egen?" Din ändring, synkas till huvudregistret inom en timme.":""}"`:` title="Sista inskickningsdag"`;
  if(!d.ymd){
    const ay=/^\d{4}-\d{2}-\d{2}$/.test(r.deadlineAntagen||"")?r.deadlineAntagen:"";
    if(open&&ay){const an=daysLeft(ay),al=dayLabel(ay);const at2=canWrite?` data-dl="${esc(r.id)}"`:"";
      return`<span class="pill antagen dl"${at2} title="Antagen sista inskickningsdag: publicering plus 7 dagar. Kundens datum saknas. Dubbelklicka för att sätta rätt dag.">${an<0?"antagen, passerad":an===0?"antagen, i dag":an===1?"antagen, 1 dag kvar":"antagen, "+an+" dagar kvar"} (${al})</span>`;}
    return open?`<span class="pill miss dl"${edit}>${d.text?esc(d.text)+", ":""}sätt deadline</span>`:"";}
  const n=daysLeft(d.ymd),lab=dayLabel(d.ymd),mark=d.egen?" ✎":"";
  if(n<0)return`<span class="pill bad dl"${edit}>passerad (${lab})${mark}</span>`;
  if(n===0)return`<span class="pill yel dl"${edit}>i dag (${lab})${mark}</span>`;
  return`<span class="pill ${n<=2?"yel":"blue"} dl"${edit}>${n===1?"1 dag kvar":n+" dagar kvar"} (${lab})${mark}</span>`;
}
const partArk=r=>(andr.get(r.id)||{}).arkiverad===true;
const effPrio=r=>{const a=andr.get(r.id)||{};return String(a.prioSattAt?(a.prio||""):(r.prio||""));};
const hiddenRole=r=>ARCHIVED.has(r.status)||isPassed(r)||partArk(r);
function refKey(r){const m=/^([A-Za-zÅÄÖåäö]+)\s*0*(\d+)(.*)$/.exec(String(r.ref||"").trim());return m?[0,m[1].toUpperCase(),+m[2],m[3]]:[1,"",Infinity,""];}
function refCmp(a,b){const x=refKey(a),y=refKey(b);return(x[0]-y[0])||x[1].localeCompare(y[1])||(x[2]-y[2])||x[3].localeCompare(y[3])||(a.title||"").localeCompare(b.title||"","sv");}
function deadlineSort(a,b){const x=effDeadline(a).ymd||a.deadlineAntagen||"9999",y=effDeadline(b).ymd||b.deadlineAntagen||"9999";return x.localeCompare(y)||refCmp(a,b);}

// ===== Process, samma stegindelning som huvudregistret. Stadier ändras inte här.
const stageOf=m=>m.stage||"matchad";
function procOf(m){const st=stageOf(m);if(m.dismissed)return"avslut";if(st==="avslutad")return m.result==="Tillsatt"?"klar":"avslut";if(["presenterad","intervju","erbjudande"].includes(st))return"inskickad";if(st==="intresserad")return"dialog";if(st==="ansokt")return"inkommet";return"kontakt";}
const PSTEPS=[["kontakt","Kontakt","1"],["dialog","Intresserade, underlag","2"],["inskickad","Inskickade till kund","3"],["klar","Tillsatta","4"],["inkommet","Ansökningar att granska",""],["avslut","Avslutade och nej",""]];
const linksForRole=id=>[...matches.values()].filter(m=>m.roleId===id);
const linksForCand=id=>[...matches.values()].filter(m=>m.candId===id);
function defaultStep(id){const all=linksForRole(id);for(const k of["dialog","kontakt","inkommet","inskickad","klar"])if(all.some(m=>procOf(m)===k))return k;return"kontakt";}
// Nej från partnern arkiverar kandidaten ur steg 1 (döljs i listan, finns kvar i data). Växlas med "visa nej".
const showNej={};
const isNej=m=>procOf(m)==="kontakt"&&bedOf(m)==="nej";
// Egna kandidater som partnern lagt till visas i steg 1 som "synkas" tills huvudregistret skapat kandidat och matchning.
const normLi=u=>String(u||"").toLowerCase().replace(/^https?:\/\/(www\.)?/,"").replace(/\/+$/,"").split("?")[0];
function egnaRows(id){return[...egna.values()].filter(e=>e.roleId===id&&!e.avvisad&&!(e.candId&&matches.has(id+"__"+e.candId))&&![...cands.values()].some(c=>c.linkedin&&normLi(c.linkedin)===normLi(e.linkedin)&&matches.has(id+"__"+c.id))).map(e=>({id:"egen:"+e.id,roleId:id,candId:"egen:"+e.id,candName:[e.fornamn,e.efternamn].filter(Boolean).join(" "),stage:"matchad",egen:e}));}
function listFor(id,all){if(!procPick[id])procPick[id]=defaultStep(id);const k=procPick[id];const base=linksForRole(id).filter(m=>procOf(m)===k&&(all||showNej[id]||!isNej(m))).sort((a,b)=>((b.score??-1)-(a.score??-1))||(a.candName||"").localeCompare(b.candName||"","sv"));return k==="kontakt"?base.concat(egnaRows(id)):base;}

// ===== Kontaktbeställningar. Partnern läser bara sitt eget dokument, ägaren och redaktörer läser alla.
const OPEN=new Set(["bestalld","utkast","vantar-godkannande","vantar_godkannande","pagar","godkand","vantar-text"]);
const key=m=>m.roleId+"__"+m.candId;
function findOrder(m){let best=null;for(const[uid,doc]of Object.entries(orders)){const p=doc&&doc.poster&&doc.poster[key(m)];if(p&&(!best||(p.at||"")>(best.at||"")))best={...p,uid};}return best;}
// Svar: strukturerat fält på matchningen (svar.tolkning) går först, sedan beställningens svarTolkning.
function replyOf(m,o){const s=m.svar&&typeof m.svar==="object"?m.svar:null;if(s&&s.tolkning)return{tolkning:s.tolkning,at:s.at,text:s.text||""};if(o&&(o.svarAt||o.status==="svar"))return{tolkning:o.svarTolkning||"okand",at:o.svarAt,text:o.svarText||""};return null;}
const TOLK={positiv:["Svar positivt","ok"],negativ:["Svar negativt","bad"],fraga:["Svar, fråga","warn"],okand:["Svar mottaget","ok"]};
function orderStatus(o,m){
  if(!o)return null;
  const rp=m?replyOf(m,o):null;
  if(rp){const[l,k]=TOLK[rp.tolkning]||TOLK.okand;return{t:`${l}${rp.at?" "+fmt(rp.at):""}`,k};}
  if(o.status==="skickat")return o.kvittens?{t:`InMail skickat ${fmt(o.kvittens)}, kvitterat`,k:"ok"}:{t:"Markerad skickad men kvittens saknas, inte bekräftad",k:"warn"};
  if(o.status==="fel")return{t:"Fel i utförandet"+(o.fel?`: ${o.fel}`:""),k:"bad"};
  if(o.status==="avvisad")return{t:"Avvisad"+(o.fel?`: ${o.fel}`:""),k:"bad"};
  if(o.status==="pagar")return{t:"Skickas nu",k:""};
  if(o.status==="vantar-text")return{t:"Väntar på att uppdragets InMail-text skrivs",k:"warn"};
  if(o.status==="utkast")return{t:"Utkast klart, väntar på godkännande",k:"warn"};
  if(o.status==="vantar-godkannande"||o.status==="vantar_godkannande"||(o.status==="bestalld"&&o.kravGodkannande!==false))return{t:"Beställd, väntar på godkännande",k:"warn"};
  if(o.status==="bestalld"||o.status==="godkand")return{t:"InMail beställt, skickas vid nästa körning",k:"warn"};
  return{t:"Status: "+(o.status||"okänd"),k:""};
}
const roleContacts=(c,m)=>(c.kontakter||[]).filter(k=>k&&k.roleId===m.roleId);
const hasStop=(c,m)=>!!(c&&(c.kontaktstopp||c.kontaktStopp||c.contactStop))||m.praktisktStatus==="stopp";
function blockReason(m,c){
  c=c||cands.get(m.candId)||{};
  const o=findOrder(m);
  if(hasStop(c,m))return"Kontaktstopp eller praktiskt stopp på matchningen. Inget InMail beställs.";
  if(o&&(OPEN.has(o.status)||o.status==="skickat"||o.status==="svar"))return"Det finns redan en beställning för kandidaten på uppdraget.";
  const inm=roleContacts(c,m).filter(k=>k.kanal==="inmail");
  if(inm.length)return`InMail finns redan registrerat på uppdraget (${inm.map(k=>fmtDay(k.at)).join(", ")}).`;

// ===== Läge per uppdrag: från Begär search till svar. Beräknas ur data, ingen egen statusmaskin.
function roleState(r){
  const all=linksForRole(r.id).filter(m=>!m.dismissed&&stageOf(m)!=="avslutad");
  const kont=all.filter(m=>procOf(m)==="kontakt");

    ja:kont.filter(m=>bedOf(m)==="ja").length,nej:kont.filter(m=>bedOf(m)==="nej").length,kontakt:kont.length,
    dialog:all.filter(m=>procOf(m)==="dialog").length,inskickad:all.filter(m=>procOf(m)==="inskickad").length};
  const s=sreq.get(r.id);
  let main;
  if(cnt.pos)main=[`Svar positivt (${cnt.pos})`,"ok"];
  else if(cnt.fraga)main=[`Svar med fråga (${cnt.fraga})`,"warn"];
  else if(cnt.skickat)main=[`InMail skickat (${cnt.skickat})`,"blue"];
  else if(cnt.bestallt)main=[`InMail beställt (${cnt.bestallt})`,"yel"];
  else if(cnt.neg&&!cnt.kontakt)main=[`Svar negativt (${cnt.neg})`,"bad"];
  else if(cnt.kontakt-cnt.nej>0)main=[`${cnt.kontakt-cnt.nej} kandidater att ta ställning till`,"blue"];
  else if(cnt.kontakt&&cnt.nej===cnt.kontakt)main=["Alla i steg 1 fick nej","warn"];
  else if(s&&s.status==="klar")main=["Search klar, inga kandidater nådde gränsen","warn"];

}

function matchReqFor(typ,candId,roleId){return[...mreq.values()].filter(x=>x.typ===typ&&(typ==="kandidat"?x.candId===candId:x.roleId===roleId)).sort((a,b)=>(b.at||"").localeCompare(a.at||""))[0]||null;}
function matchaHTML(typ,candId,roleId){
  if(!db||!userId)return"";

  const label=typ==="kandidat"?"Matcha kandidaten mot öppna uppdrag":"Matcha uppdraget mot konsulterna";
  let st="";
  if(q&&q.status==="ny")st=`<span class="cnote">Matchning begärd ${fmt(q.at)}, huvudregistret matchar inom en timme och resultatet syns här som förslag.</span>`;

  else if(q&&q.status==="fel")st=`<span class="cnote" style="color:var(--bad)">Matchningen misslyckades: ${esc(q.fel||"okänt fel")}</span>`;

}

// ===== Deadline: dubbelklick öppnar ett datumfält ovanpå etiketten. Två klick inom 450 ms räknas också, eftersom listan ritas om vid första klicket.
function openDeadlineEditor(el){
  if(!el||!canWrite)return;const r=roles.get(el.dataset.dl);if(!r)return;
  document.querySelectorAll(".dl-pop").forEach(x=>x.remove());
  const d=effDeadline(r);const box=el.getBoundingClientRect();
  const pop=document.createElement("div");pop.className="dl-pop";pop.style.top=`${window.scrollY+box.bottom+4}px`;pop.style.left=`${window.scrollX+Math.max(8,Math.min(box.left,window.innerWidth-330))}px`;
  const inp=document.createElement("input");inp.type="date";inp.setAttribute("aria-label","Sista inskickningsdag för "+(r.title||r.id));if(d.ymd)inp.value=d.ymd;
  const ok=document.createElement("button");ok.type="button";ok.className="btn small";ok.textContent="Spara";
  const no=document.createElement("button");no.type="button";no.className="btn small light";no.textContent="Avbryt";
  pop.append(inp,ok,no);document.body.appendChild(pop);
  for(const ev of["click","mousedown","dblclick"])pop.addEventListener(ev,x=>x.stopPropagation());
  let done=false;const finish=async save=>{if(done)return;done=true;pop.remove();if(save&&inp.value){const[Y,M,D]=inp.value.split("-").map(Number);const text=`${D} ${MONTHS[M-1]} ${Y}`;const okk=await saveAndring(r.id,{deadline:text,deadlineYmd:inp.value,deadlineSattAt:nowIso(),deadlineSattAv:userId,deadlineSattAvNamn:userName});if(okk)toast(`Sista inskickningsdag satt: ${text}. Synkas till huvudregistret inom en timme.`);render();}};
  ok.addEventListener("click",()=>finish(true));no.addEventListener("click",()=>finish(false));
  inp.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();finish(true);}else if(ev.key==="Escape"){ev.preventDefault();finish(false);}});
  const away=ev=>{if(!pop.contains(ev.target)){document.removeEventListener("mousedown",away,true);finish(false);}};
  setTimeout(()=>document.addEventListener("mousedown",away,true),0);
  inp.focus();
}

async function placeOrder(m,c,instr,annons){

    const now=nowIso();
    const entry={candId:m.candId,candName:c.name||m.candName||"",roleId:m.roleId,matchId:m.id,instruktion:instr,annonslank:annons||"nej",at:now,konto:"recruiter-filip",kravGodkannande:false,go:{status:"ja",via:"staende-go-konsult",av:userId,avNamn:userName,at:now},status:"bestalld",statusAt:now,statusAv:userId,bestallare:userId,bestallareNamn:userName,kalla:"konsult-ats",kvittens:null,fel:""};
    if(snap.exists)await ref.update({poster:{[k]:entry},updatedAt:now});
    else await ref.set({bestallare:userId,bestallareNamn:userName,kalla:"konsult-ats",poster:{[k]:entry},createdAt:now,updatedAt:now});

    const id="f_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const now=nowIso();
    try{await db.doc("forslag/"+id).set({text,at:now,av:userId,avNamn:userName,vy:view,uppdrag:selected||"",synkad:false});const back=await db.doc("forslag/"+id).get();if(!back.exists)throw new Error("återläsning");
      receipt(bg,"Tack",["<b>Förslaget är sparat.</b>","Det samlas med övriga förslag och läses vid nästa genomgång."]);}
    catch(e){busy=false;fail(bg,"#f-save","Skicka förslag","Förslaget sparades inte ("+(e.code||e.message||"fel")+").");}});
}
function underlagText(m){
  const c=cands.get(m.candId)||{};const r=roles.get(m.roleId)||{};const arr=v=>Array.isArray(v)?v:(v?[v]:[]);
  const L=[`Kandidat: ${c.name||m.candName||""}`,`Uppdrag: ${[r.ref,r.title].filter(Boolean).join(" ")}`,`Stadie: ${STAGE[stageOf(m)]||stageOf(m)}`,""];
  L.push("BEKRÄFTAT",...(arr(m.belagt).length?arr(m.belagt).map(x=>"- "+x):["- inget registrerat"]),"");
  L.push("ATT VERIFIERA",...(arr(m.verifiera).length?arr(m.verifiera).map(x=>"- "+x):["- inget registrerat"]),"");
  if(arr(m.saknas).length)L.push("SAKNAS",...arr(m.saknas).map(x=>"- "+x),"");
  L.push(`Praktiskt: ${m.praktiskt||"ej registrerat"}`,`Tillgänglig: ${c.tillganglig||"ej registrerat"}`,`Bolagsform: ${BOLAG[c.bolagsform]||"ej registrerat"}`);
  if(c.linkedin)L.push(`LinkedIn: ${c.linkedin}`);
  const ct=contactOf(c);if(ct.phone)L.push(`Telefon: ${ct.phone}`);if(ct.email)L.push(`Mejl: ${ct.email}`);
  return neutral(L.join("\n"));
}
async function copyUnderlag(m){const txt=underlagText(m);try{await navigator.clipboard.writeText(txt);toast("Kandidatunderlaget är kopierat.");}catch{const {bg}=modal("Kandidatunderlag",`<p class="hint">Markera texten och kopiera den.</p><textarea readonly style="min-height:260px">${esc(txt)}</textarea><div class="acts" style="justify-content:flex-end"><button class="btn light" type="button" data-close>Stäng</button></div>`);bg.querySelector("textarea").select();}}

// ===== Data
const profiles={};
async function resolveNames(user){const ids=[...new Set([...comments.values()].map(q=>q.av).filter(a=>/^u_/.test(a||"")))].filter(id=>!(id in profiles));if(!ids.length||!user||typeof user.profiles!=="function")return;try{const ps=await user.profiles(ids);for(const id of ids)profiles[id]=(ps&&ps[id]&&ps[id].name)||"";renderDetail();}catch{}}
(async()=>{
  const use=n=>(window.claude&&typeof window.claude.use==="function")?window.claude.use(n):Promise.resolve(null);
  db=await use("db");const user=await use("user");
  if(!db){setSync("Ingen databas i den här vyn. Logga in eller öppna sidan på nytt.",true);$("#detail").innerHTML=`<div class="empty">Databasen kan inte nås i den här vyn.</div>`;return;}
  try{userId=user?await user.id():null;isOwner=user?await user.isOwner():false;canAdmin=user&&typeof user.canEdit==="function"?await user.canEdit():false;const me=user?await user.me():null;userName=(me&&me.name)||"";}catch{}
  const w=user?await user.can("data.write"):null;canWrite=w!==false&&!!userId;
  assets=canWrite?await use("assets"):null;
  $("#who").textContent=userName?`Inloggad: ${userName}`:(isOwner?"Inloggad som ägare":"");
  try{selected=localStorage.getItem("konsult.selected")||null;const v=localStorage.getItem("konsult.view");if(["uppdrag","konsulter","sok"].includes(v))view=v;}catch{}
  let got=0;const ALL=1|2|4;let deepDone="";const done=()=>{if((got&ALL)===ALL){setSync(`Synkad ${new Date().toLocaleTimeString("sv-SE",{timeZone:TZ,hour:"2-digit",minute:"2-digit"})}`);applyDeepLink();}};
  // Djuplänkar från Ping-budets mail: #uppdrag=<roleId> eller #kandidat=<roleId>__<candId>
  function applyDeepLink(){const mm=/^#(uppdrag|kandidat)=([A-Za-z0-9_\-]{1,160})$/.exec(location.hash||"");if(!mm||deepDone===location.hash)return;deepDone=location.hash;if(mm[1]==="kandidat"){if(matches.has(mm[2]))openMatch(mm[2]);else toast("Kandidaten finns inte i din vy.");}else{if(roles.has(mm[2]))openRole(mm[2]);else toast("Uppdraget finns inte i din vy.");}}
  window.addEventListener("hashchange",()=>{deepDone="";applyDeepLink();});
  const timer=setTimeout(()=>{if((got&ALL)!==ALL)setSync("Data kan inte nås ännu. Det som visas kan vara inaktuellt.",true);},10000);
  const fail=what=>e=>{setSync(`Fel vid läsning av ${what} (${e&&e.code||"okänt"})`,true);};
  const toMap=s=>new Map(s.docs.filter(d=>d.exists).map(d=>[d.id,{id:d.id,...d.data()}]));
  db.collection("roles").onSnapshot(s=>{roles=toMap(s);if(selected&&!roles.has(selected))selected=null;if(!selected){const v=visibleRoles();selected=v[0]?.id||null;}got|=1;render();done();},fail("uppdrag"));
  db.collection("candidates").onSnapshot(s=>{cands=toMap(s);got|=2;render();done();},fail("kandidater"));
  db.collection("matches").onSnapshot(s=>{matches=toMap(s);got|=4;render();done();},fail("matchningar"));
  db.collection("kommentarer").onSnapshot(s=>{comments=toMap(s);renderDetail();resolveNames(user);},fail("kommentarer"));
  db.collection("andringar").onSnapshot(s=>{andr=toMap(s);render();},fail("ändringar"));
  db.collection("cv").onSnapshot(s=>{cvs=toMap(s);renderDetail();},fail("CV"));
  db.collection("searchbegaran").onSnapshot(s=>{sreq=toMap(s);render();},fail("searchbegäran"));
  db.collection("bedomningar").onSnapshot(s=>{bed=toMap(s);render();},fail("bedömningar"));
  db.collection("kontaktuppgifter").onSnapshot(s=>{kuppg=toMap(s);renderDetail();},fail("kontaktuppgifter"));
  db.collection("egna").onSnapshot(s=>{egna=toMap(s);render();},fail("egna kandidater"));
  db.collection("pingar").onSnapshot(s=>{pings=toMap(s);renderDetail();},()=>{});
  db.collection("matchbegaran").onSnapshot(s=>{mreq=toMap(s);renderDetail();},()=>{});
  const ordErr=e=>{ordersState="fel";ordersErr=e&&e.code||"okänt";setSync(`Beställningsstatus kunde inte läsas (${ordersErr})`,true);renderDetail();};
  if(isOwner||canAdmin)db.collection("kontaktbestallningar").onSnapshot(s=>{orders={};for(const d of s.docs)if(d.exists)orders[d.id]=d.data();ordersState="ok";render();},ordErr);
  else if(userId)db.doc("kontaktbestallningar/"+userId).onSnapshot(s=>{orders=s.exists?{[userId]:s.data()}:{};ordersState="ok";render();},ordErr);
  else{ordersState="fel";ordersErr="ingen identitet";renderDetail();}
  void timer;
})();
</script>
