:root{
  --bg:#eef1f6; --surface:#ffffff; --ink:#15213b; --muted:#56627c; --line:#d5dbe7;
  --accent:#d92d2a; --on-accent:#ffffff; --mark-bg:#fff1bf; --mark-ink:#5e4700; --ok:#1c7a4d;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101726; --surface:#1a2337; --ink:#eef2fa; --muted:#a3aec6; --line:#2f3b56;
    --accent:#ff5a52; --on-accent:#1a0605; --mark-bg:#4a3b06; --mark-ink:#ffe9a3; --ok:#5fd39a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101726; --surface:#1a2337; --ink:#eef2fa; --muted:#a3aec6; --line:#2f3b56;
  --accent:#ff5a52; --on-accent:#1a0605; --mark-bg:#4a3b06; --mark-ink:#ffe9a3; --ok:#5fd39a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.55}
.wrap{max-width:1040px;margin:0 auto;padding:20px 20px 96px;display:flex;flex-direction:column;gap:26px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:30px;letter-spacing:-.02em}
.demo{font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.status{margin:0;padding:4px 0 4px 14px;border-left:4px solid var(--line);color:var(--muted);font-size:16px;cursor:default}
.status b{color:var(--ink);font-weight:600}
h1{font-family:var(--display);font-weight:700;font-size:clamp(32px,5.4vw,54px);line-height:1.06;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.2;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:20px;margin:0}
p{margin:0;max-width:62ch}
.pre{white-space:pre-line}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:20px}
.two{display:grid;grid-template-columns:1fr 1.1fr;gap:44px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
@media (max-width:820px){.two{grid-template-columns:1fr;gap:24px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;display:flex;flex-direction:column;gap:14px}
.card.big{padding:32px}
@media (max-width:480px){.card.big{padding:20px}.card{padding:18px}.wrap{padding:14px 14px 96px}}
button.kort{font:inherit;color:inherit;text-align:left;cursor:pointer;gap:10px}
button.kort:hover{border-color:var(--ink)}
.kort .t{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.2;display:block}
.kort .x{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);white-space:pre-line}
.mark{align-self:flex-start;background:var(--mark-bg);color:var(--mark-ink);font-size:13px;font-weight:600;padding:3px 9px;border-radius:4px;display:inline-block}
.sim{font-size:14px;color:var(--muted)}
.dim{opacity:.72}
.stack>.link{align-self:flex-start}
.f{display:flex;flex-direction:column;gap:6px}
label,legend{font-weight:600;font-size:16px}
.hint{font-weight:400;color:var(--muted);font-size:14px}
input[type=text],input[type=email],input[type=tel],input[type=url],textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:13px 14px;width:100%}
textarea{resize:vertical}
input[readonly]{background:var(--bg);color:var(--muted)}
[aria-invalid=true]{border-color:var(--accent);border-width:2.5px}
.fel{color:var(--accent);font-size:15px;font-weight:600}
.fel:empty,.ok:empty{display:none}
.ok{color:var(--ok);font-size:15px;font-weight:600}
input:focus-visible,textarea:focus-visible,button:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:999px;padding:15px 30px;font-weight:600;font-size:19px;align-self:flex-start}
.btn[disabled],.pick[disabled]{opacity:.45;cursor:not-allowed}
.btn2{background:transparent;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:11px 22px;font-weight:600;font-size:16px;align-self:flex-start}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pick{min-height:48px;min-width:48px;border-radius:10px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:600;padding:0 16px}
.pick[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-size:14px}
.note{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--ok);border-radius:10px;padding:16px 18px}
.valrad{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.val{background:transparent;border:1px solid var(--line);border-radius:10px;padding:12px 16px;text-align:left;color:var(--ink);font-size:16px;font-weight:600;line-height:1.3;display:flex;flex-direction:column;gap:4px}
.val:hover{border-color:var(--ink)}
.val[aria-current=true]{background:var(--surface);border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.bar{position:relative;height:14px;border-radius:99px;overflow:hidden;background:linear-gradient(90deg,#d92d2a,#f2c230 50%,#1c7a4d)}
.bar i{position:absolute;right:0;top:0;bottom:0;background:var(--line);transition:width .3s}
.chk{display:flex;gap:10px;align-items:center;font-weight:500}
.chk input{width:22px;height:22px;accent-color:var(--accent)}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.rad{display:flex;gap:18px}
.rad label{display:flex;gap:8px;align-items:center;font-weight:500}
.rad input{width:22px;height:22px;accent-color:var(--accent)}
dl{margin:0;display:grid;gap:10px}
dt{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
dd{margin:0}
details{border-top:1px solid var(--line);padding-top:14px}
summary{cursor:pointer;color:var(--muted);font-size:15px}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink);padding:0;width:min(1000px,calc(100vw - 20px));max-height:calc(100vh - 20px);overflow:auto}
dialog.smal{width:min(520px,calc(100vw - 20px))}
dialog::backdrop{background:rgba(10,16,30,.62)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px}
.dpad{padding:0 18px 22px}
.dsplit{display:grid;grid-template-columns:1.2fr 1fr;gap:24px;padding:0 18px 22px;align-items:start}
@media (max-width:820px){.dsplit{grid-template-columns:1fr}}
.prov{position:fixed;right:14px;bottom:14px;background:var(--surface);color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13px;z-index:5}
.pbi{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.pbi[aria-pressed=true]{border-color:var(--ink);border-width:2px}
.pblist{display:flex;flex-direction:column;gap:8px;max-height:260px;overflow:auto}
.mailbox{background:#fff;color:#111;border-radius:10px;padding:14px;overflow:auto}
.in{animation:in .35s ease-out}
@keyframes in{from{transform:translateY(8px)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.in{animation:none}.bar i{transition:none}*{scroll-behavior:auto!important}}
</style>
</head>

  <header class="top">
    <div class="brand" aria-label="Start">
      <svg width="34" height="38" viewBox="0 0 34 38" aria-hidden="true"><rect x="3" y="27" width="28" height="9" rx="4.5" fill="currentColor"/><rect x="15" y="12" width="4" height="17" rx="2" fill="currentColor"/><circle cx="17" cy="9" r="7" fill="var(--accent)"/></svg>
      <span id="namn" hidden></span>
    </div>
    <div class="demo"><span>Prov med påhittad data. Inget skickas.</span><span id="vem"></span><button class="link" id="ut" type="button" hidden>Logga ut</button></div>
  </header>
  <p class="status" id="status" aria-live="polite"></p>
  <main id="app"></main>
</div>

function fel(e){var m=(e&&e.message)||'';for(var n in FEL){if(m.indexOf(n)>-1)return FEL[n];}return 'Något gick fel. Försök igen.';}
function ar(e,o){return !!(e&&e.message&&e.message.indexOf(o)>-1);}
async function k(f){
  try{var r=await f();return r||{data:null,error:{message:'natverk'}};}
  catch(e){return {data:null,error:{message:'natverk'}};}
}
async function utskick(body){
  try{
    var r=await fetch(ADR+'/functions/v1/joy-utskick',{method:'POST',headers:{'Content-Type':'application/json',apikey:NYCKEL},body:JSON.stringify(body)});
    return await r.json();
  }catch(e){return {ok:false,skal:'natverk'};}
}
/* Webbläsarens märke: ett slumpat id som bara sparas i den här webbläsaren. Följer med till loggen över
   inloggningar och öppnade länkar, så att det syns om en länk öppnas någon annanstans. */
function wb(){
  try{
    var v=localStorage.getItem('joy_wb');
    if(!v){v=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():'w'+Date.now().toString(36)+Math.random().toString(36).slice(2);localStorage.setItem('joy_wb',v);}
    return v;
  }catch(e){return null;}
}
/* Loggningen sker tyst. Ett fel här får aldrig stoppa kunden. */
function loggInloggning(lank){k(function(){return sb.rpc('joy_logga_inloggning',{p_webblasare:wb(),p_lank:lank||null});});}
function loggLank(lank){k(function(){return sb.rpc('joy_logga_lank',{p_lank:lank,p_webblasare:wb()});});}
async function medFarsk(f){
  var r=await k(f);
  if(r.error&&ar(r.error,'farsk_kod_kravs')){
    var ok=await farskRuta();
    if(!ok)return {data:null,error:{message:'avbrutet'}};
    r=await k(f);
  }
  return r;
}
function fmtDag(s){
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');if(!m)return s||'';
  return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString('sv-SE',{weekday:'long',day:'numeric',month:'long'});
}
function fmtTid(t){return String(t||'').slice(0,5);}
function iso(x){return x.getFullYear()+'-'+p2(x.getMonth()+1)+'-'+p2(x.getDate());}

/* Bara i prov. Läser koden ur det senaste loggade mejlet till adressen.
   inteId satt: begär först en ny kod och väntar på ett nyare mejl än det med det id:t. */
async function provkod(mejl,inteId){
  if(inteId!==undefined){
    var u=await utskick({mejl:mejl});
    if(!u.ok)return {skal:u.skal};
    await sleep(600);
  }
  for(var i=0;i<5;i++){
    var r=await k(function(){return sb.rpc('joy_prov_brevlada',{p_mejl:mejl});});
    if(r.error)return {stangd:ar(r.error,'provbrevladan_ar_stangd')};
    var m=(r.data||[]).filter(function(x){return x.kanal==='mejl';})[0];
    if(!m)return {};
    if(m.id!==inteId&&m.status!=='ko'){
      var hit=m.status==='loggad'?/kod[^0-9]{0,60}(\d{8})(?!\d)/i.exec(String(m.html||'').replace(/<[^>]*>/g,' ')):null;
      return hit?{kod:hit[1],id:m.id}:{id:m.id};
    }
    if(m.status==='ko')await utskick({});
    await sleep(1000);
  }
  return {};
}
function kodBox(mejl,o){
  var id=uid();
  var inp=h('input',{id:id,type:'text',inputmode:'numeric',autocomplete:'one-time-code',maxlength:'8',pattern:'[0-9]*','aria-describedby':id+'-e'});
  var er=h('p',{class:'fel',id:id+'-e',role:'alert'});
  var okp=h('p',{class:'ok',role:'status'});
  var btn=h('button',{class:'btn',type:'submit'},['Logga in']);
  var ny=h('button',{class:'link',type:'button',onclick:async function(){
    er.textContent='';okp.textContent='';
    var u=await utskick({mejl:mejl});
    if(u.ok)okp.textContent='En ny kod är skickad.';else er.textContent=SK_UT[u.skal]||fel({});
  }},['Skicka en ny kod']);
  async function loggaIn(kod){
    var r=await k(function(){return sb.auth.verifyOtp({email:mejl,token:kod,type:'email'});});
    if(r.error||!r.data||!r.data.user)return false;
    S.mejl=r.data.user.email||mejl;hdr();
    loggInloggning(null);
    o.onOk();return true;
  }
  /* Bara i prov: hämtar koden ur det senaste loggade mejlet och loggar in. Finns bara när provbrevlådan är öppen. */
  var prov=S.cfg.prov_brevlada_oppen?h('button',{class:'btn2',type:'button',onclick:async function(){
    er.textContent='';okp.textContent='';inp.removeAttribute('aria-invalid');
    prov.disabled=true;btn.disabled=true;
    var a=await provkod(mejl);
    if(a.kod){inp.value=a.kod;if(await loggaIn(a.kod))return;}
    if(!a.stangd){
      /* Ingen kod i senaste mejlet, eller koden var redan använd: begär en ny och försök en gång till. */
      var b=await provkod(mejl,a.id||null);
      if(b.kod){inp.value=b.kod;if(await loggaIn(b.kod))return;}
      a=b;
    }
    prov.disabled=false;btn.disabled=false;inp.value='';
    er.textContent=a.stangd?FEL.provbrevladan_ar_stangd:(a.skal&&SK_UT[a.skal])||'Det gick inte att hämta en provkod. Tryck Skicka en ny kod och försök igen.';
  }},['Hämta provkoden']):null;
  var f=h('form',{class:'card big',novalidate:true,onsubmit:async function(ev){
    ev.preventDefault();er.textContent='';okp.textContent='';inp.removeAttribute('aria-invalid');
    var kod=inp.value.replace(/\D/g,'');
    if(kod.length!==8){inp.setAttribute('aria-invalid','true');er.textContent='Koden har 8 siffror.';inp.focus();return;}
    btn.disabled=true;
    var ok=await loggaIn(kod);
    btn.disabled=false;
    if(!ok){inp.setAttribute('aria-invalid','true');er.textContent='Koden stämde inte eller har gått ut. Skicka en ny kod.';}
  }},[
    h('h2',null,[o.rubrik||'Skriv koden från mejlet']),
    h('p',null,['Vi har skickat en kod med 8 siffror till ',h('b',null,[mejl]),'.']),
    S.cfg.prov_brevlada_oppen?h('p',{class:'sim'},['Det här är ett prov, så inget mejl har gått ut. Tryck Hämta provkoden, eller läs koden i Provbrevlådan.']):null,
    h('div',{class:'f'},[h('label',{for:id},['Kod']),inp,er,okp]),
    h('div',{class:'row'},[btn,prov,ny,o.onBack?h('button',{class:'link',type:'button',onclick:o.onBack},['Tillbaka']):null])
  ]);
  setTimeout(function(){try{inp.focus();}catch(e){}},50);
  return f;
}
function farskRuta(){
  return new Promise(function(res){
    var d=h('dialog',{class:'smal','aria-label':'Färsk kod'});var klar=false;
    function slut(v){if(klar)return;klar=true;res(v);if(d.open)d.close();d.remove();}
    d.addEventListener('close',function(){slut(false);});
    var box=kodBox(S.mejl,{rubrik:'Det här kräver en färsk kod. Skriv koden från mejlet.',onOk:function(){slut(true);},onBack:function(){slut(false);}});
    d.appendChild(h('div',{class:'dh'},[provKnapp(true)||h('span'),h('button',{type:'button',class:'btn2',onclick:function(){slut(false);}},['Avbryt'])]));
    d.appendChild(h('div',{class:'dpad'},[box]));
    document.body.appendChild(d);d.showModal();
    utskick({mejl:S.mejl}).then(function(u){if(!u.ok){var e=box.querySelector('.fel');if(e)e.textContent=SK_UT[u.skal]||fel({});}});
  });
}

function vyStart(){
  var inl=!!S.mejl, kund=(S.lage&&S.lage.kund)||{}, u=S.utkast||{};
  var harBest=inl&&!!((S.lage&&S.lage.bestallningar)||[]).length;
  hdr();
  if(harBest)setStatus('Vi väntar på dina uppgifter','Du får besked om nästa steg när du tryckt Fortsätt');
  else setStatus('Vi väntar på dina uppgifter','Du får tre exempelprofiler direkt när du tryckt Fortsätt');
  var fM=falt({id:'s-mejl',label:'Mejl',type:'email',ac:'email',value:S.mejl||'',ro:inl,hint:inl?'Du är inloggad, så mejlen är låst.':null});
  var fT=falt({id:'s-tel',label:'Telefon',type:'tel',ac:'tel',value:kund.telefon||u.tel||''});
  var fF=falt({id:'s-for',label:'Företag',ac:'organization',value:kund.foretag||u.foretag||''});
  var fR=falt({id:'s-tit',label:'Din titel',ac:'organization-title',value:kund.egen_titel||u.titel||''});
  var fA=falt({id:'s-ann',label:'Annons',area:true,hint:'Länk eller text.',value:u.annons||''});
  var fP=falt({id:'s-ref',label:'Referensprofil',im:'url',hint:'Länk.',value:u.ref||''});
  var bar=h('div',{class:'bar',role:'progressbar','aria-valuemin':'0','aria-valuemax':'100','aria-label':'Underlag','aria-valuenow':'0'});
  var cov=h('i');bar.appendChild(cov);
  var lab=h('span',{class:'sim'});
  function upd(){
    var w=S.cfg.underlag_vikter||DEF.underlag_vikter,p=0;
    if(fA.inp.value.trim())p+=w.annons||0;
    if(fR.inp.value.trim())p+=w.titel||0;
    if(fP.inp.value.trim())p+=w.referens||0;
    if(p>100)p=100;
    cov.style.width=(100-p)+'%';bar.setAttribute('aria-valuenow',p);
    lab.textContent='Underlag: '+p+' procent. Ju mer du ger oss, desto bättre träffar profilerna.';
  }
  [fA,fR,fP].forEach(function(f){f.inp.addEventListener('input',upd);});
  var bada=h('input',{type:'checkbox',id:'s-bada'});
  bada.checked=(kund.notis_bada===false||u.bada===false)?false:true;
  var numBox=h('div',{class:'row'});
  var andra=h('button',{class:'link',type:'button',onclick:function(){
    if(!S.mejl){fT.inp.focus();return;}
    if(numBox.firstChild){numBox.replaceChildren();return;}
    var ni=h('input',{type:'tel',autocomplete:'tel','aria-label':'Nytt nummer',value:fT.inp.value});
    var nm=h('span',{class:'fel',role:'alert'});
    numBox.replaceChildren(ni,h('button',{class:'btn2',type:'button',onclick:async function(){
      nm.className='fel';nm.textContent='';
      var r=await k(function(){return sb.rpc('joy_notis',{p_bada:bada.checked,p_telefon:ni.value});});
      if(r.error){nm.textContent=fel(r.error);return;}
      fT.inp.value=(r.data&&r.data.telefon)||ni.value;nm.className='ok';nm.textContent='Numret är sparat.';
    }},['Spara nummer']),nm);
    ni.focus();
  }},['Ändra nummer']);
  var skalBox=h('div',{class:'fel',role:'alert'});
  var btn=h('button',{class:'btn',type:'submit'},['Fortsätt']);
  var form=h('form',{class:'card big',novalidate:true},[
    fM.wrap,fT.wrap,fF.wrap,fR.wrap,fA.wrap,fP.wrap,
    h('p',{class:'sim'},['Profilen används bara som förebild. Personen kontaktas inte och visas inte för någon.']),
    h('div',{class:'f'},[bar,lab]),
    h('label',{class:'chk',for:'s-bada'},[bada,'Notis på båda, mejl och sms']),
    h('div',{class:'f'},[andra,numBox]),
    skalBox,btn
  ]);
  upd();
  var box=h('div',{class:'stack'},[form]);
  function lasMejl(){fM.inp.setAttribute('readonly','');}
  function varden(){
    return {mejl:fM.inp.value.trim(),tel:fT.inp.value.trim(),foretag:fF.inp.value.trim(),titel:fR.inp.value.trim(),
      annons:fA.inp.value.trim(),ref:fP.inp.value.trim(),bada:bada.checked};
  }
  async function skicka(v){
    var key=JSON.stringify(v);
    if(key!==S.idemKey){S.idemKey=key;S.idem=uuid();}
    btn.disabled=true;
    var r=await k(function(){return sb.rpc('joy_start',{p_telefon:v.tel,p_foretag:v.foretag,p_egen_titel:v.titel||null,p_annons:v.annons||null,p_referensprofil:v.ref||null,p_notis_bada:v.bada,p_idem:S.idem});});
    btn.disabled=false;
    if(r.error){
      if(ar(r.error,'inte_inloggad')){S.mejl=null;hdr();skalBox.textContent='Du är inte inloggad längre. Tryck Fortsätt så får du en ny kod.';return;}
      if(ar(r.error,'nyckeln_ar_upptagen'))S.idemKey='';
      skalBox.textContent=fel(r.error);return;
    }
    var d=r.data||{};
    if(!d.gron){
      var skal=d.skal||[];
      skalBox.replaceChildren.apply(skalBox,skal.map(function(s){return h('p',null,[SK_START[s]||'Något saknas. Kontrollera uppgifterna.']);}));
      if(skal.indexOf('telefon_saknas')>-1)markera(fT,SK_START.telefon_saknas);
      if(skal.indexOf('foretag_saknas')>-1||skal.indexOf('bolaget_hittades_inte')>-1)markera(fF,SK_START[skal.indexOf('foretag_saknas')>-1?'foretag_saknas':'bolaget_hittades_inte']);
      if(skal.indexOf('mejl_saknas')>-1)markera(fM,SK_START.mejl_saknas);
      return;
    }
    S.utkast=null;S.idem=null;S.idemKey='';
    nav('vy=granska&b='+encodeURIComponent(d.bestallning_id));
  }
  form.addEventListener('submit',async function(ev){
    ev.preventDefault();
    [fM,fT,fF].forEach(rensa);skalBox.replaceChildren();
    var v=varden(),bad=null;
    function krav(f,val,t){if(!val){markera(f,t);if(!bad)bad=f;}}
    if(!/^\S+@\S+\.\S+$/.test(v.mejl)){markera(fM,'Fyll i din mejl.');bad=fM;}
    krav(fT,v.tel,'Fyll i ditt telefonnummer.');
    krav(fF,v.foretag,'Fyll i företaget.');
    if(bad){bad.inp.focus();return;}
    S.utkast=v;
    if(S.mejl){await skicka(v);return;}
    btn.disabled=true;
    var u=await utskick({mejl:v.mejl});
    btn.disabled=false;
    if(!u.ok){markera(fM,SK_UT[u.skal]||fel({}));fM.inp.focus();return;}
    box.replaceChildren(kodBox(v.mejl,{rubrik:'Skriv koden från mejlet',
      onOk:function(){box.replaceChildren(form);lasMejl();skicka(v);},
      onBack:function(){box.replaceChildren(form);}}));
  });
  visa(h('div',{class:'two'},[
    h('div',{class:'stack'},[h('span',{class:'eyebrow'},['Din kundyta']),h('h1',null,['Hitta din medarbetare']),
      h('p',null,[harBest?'Berätta vem du söker i den nya beställningen.':'Berätta vem du söker. Du får tre exempelprofiler direkt, utan kostnad.']),
      inl?null:h('a',{href:'#vy=login',class:'sim'},['Redan kund? Logga in']),
      harBest?h('a',{href:'#vy=granska',class:'sim'},['Tillbaka till dina beställningar']):null]),
    box]));
}

      a.disabled=true;n.disabled=true;msg.textContent='';
      medFarsk(function(){return sb.rpc('joy_godkann_match',{p_matchning:m.matchning_id,p_ja:ja});}).then(async function(r){
        if(r.error){msg.textContent=fel(r.error);a.disabled=false;n.disabled=false;return;}
        S.godkMsg='Svaret är sparat: '+(r.data&&r.data.status==='godkand'?'godkänd':'nekad')+'.';
        await laddaVantande();
        var ny=godkEl();sec.replaceWith(ny);
      });
    }
    a.addEventListener('click',function(){gor(true);});n.addEventListener('click',function(){gor(false);});
    sec.appendChild(h('div',{class:'note'},[h('b',null,[String(m.titel||'')]),h('p',null,[String(m.foretag||'')+', '+fmtDag(m.dag)+' kl '+fmtTid(m.tid)]),
      h('div',{class:'row',style:'margin-top:10px'},[a,n]),msg]));
  });
  return sec;
}

/* ---------- provbrevlåda ---------- */
function provKnapp(i){
  if(!S.cfg.prov_brevlada_oppen)return null;
  return h('button',{type:'button',class:i?'link':'prov',onclick:oppnaProv},['Provbrevlåda (bara i prov)']);
}
function oppnaProv(){
  var pb=$('#pb');
  if(!pb){pb=h('dialog',{id:'pb','aria-label':'Provbrevlåda'});document.body.appendChild(pb);}
  var mi=h('input',{type:'email',id:'pbm',autocomplete:'email',value:PB.mejl||S.mejl||''});
  var msg=h('p',{class:'fel',role:'alert'});
  var lista=h('div',{class:'pblist'}),vis=h('div',{class:'stack'});
  var pumpat=false;
  var L={mejl:'Mejl',sms:'Sms'},M={inbjudan:'Inbjudan',nya_profiler:'Nya profiler',bokat_mote:'Bokat möte'},ST={ko:'I kö',loggad:'Loggat',fel:'Fel'};
  function visaMejl(x,knapp){
    Array.prototype.forEach.call(lista.children,function(c){c.setAttribute('aria-pressed','false');});
    knapp.setAttribute('aria-pressed','true');
    var kropp;
    if(x.kanal==='mejl'&&x.html){
      kropp=h('div',{class:'mailbox'});kropp.innerHTML=x.html;
      kropp.addEventListener('click',function(ev){
        var a=ev.target.closest&&ev.target.closest('a');var hr=a&&a.getAttribute('href');
        if(hr&&hr.charAt(0)==='#'){ev.preventDefault();var s=hr.slice(1);if(location.hash.slice(1)===s)route();else location.hash=s;}
      });
    }else kropp=h('p',{class:'pre'},[x.text_kort||(x.status==='ko'?'Mejlet ligger i kön. Tryck Visa igen om en stund.':'')]);
    vis.replaceChildren(h('h3',null,[x.amne||'Utan ämne']),h('p',{class:'sim'},['Till '+x.till+'. '+(ST[x.status]||'')]),kropp);
  }
  function rita(l){
    if(!l.length){lista.replaceChildren(h('p',{class:'sim'},['Inga mejl eller sms ännu för den adressen.']));return;}
    lista.replaceChildren.apply(lista,l.map(function(x){
      var b=h('button',{type:'button',class:'pbi','aria-pressed':'false'},[
        h('b',null,[(L[x.kanal]||x.kanal)+', '+(M[x.mall]||x.mall)]),h('span',null,[x.amne||'Utan ämne']),
        h('span',{class:'sim'},[(x.skapad?new Date(x.skapad).toLocaleString('sv-SE'):'')+', '+(ST[x.status]||'')])]);
      b.addEventListener('click',function(){visaMejl(x,b);});return b;
    }));
  }
  async function ladda(){
    msg.textContent='';var m=mi.value.trim();PB.mejl=m;
    if(!m){msg.textContent='Skriv en mejladress.';return;}
    var r=await k(function(){return sb.rpc('joy_prov_brevlada',{p_mejl:m});});
    if(r.error){msg.textContent=fel(r.error);return;}
    var l=r.data||[];
    if(!pumpat&&l.some(function(x){return x.status==='ko';})){
      pumpat=true;await utskick({});await sleep(1000);
      var r2=await k(function(){return sb.rpc('joy_prov_brevlada',{p_mejl:m});});
      if(!r2.error)l=r2.data||[];
    }
    rita(l);
  }
  pb.replaceChildren(
    h('div',{class:'dh'},[h('h2',null,['Provbrevlåda']),h('button',{type:'button',class:'btn2',onclick:function(){pb.close();}},['Stäng'])]),
    h('div',{class:'dpad stack'},[
      h('p',{class:'sim'},['Bara i prov. Här syns de mejl och sms som annars hade skickats.']),
      h('form',{class:'row',onsubmit:function(ev){ev.preventDefault();pumpat=false;ladda();}},[h('label',{for:'pbm',class:'hint'},['Mejl']),mi,h('button',{class:'btn2',type:'submit'},['Visa'])]),
      msg,lista,vis]));
  if(!pb.open)pb.showModal();
  ladda();
}

/* ---------- start ---------- */
async function init(){
  if(!sb){$('#app').replaceChildren(h('div',{class:'card'},[h('p',{class:'fel',role:'alert'},[FEL.natverk])]));return;}
  $('#ut').addEventListener('click',async function(){
    await k(function(){return sb.auth.signOut();});
    S.mejl=null;S.lage=null;S.vantande=null;S.prof=null;S.best=null;S.godkMsg='';S.utkast=null;S.idem=null;S.idemKey='';S.redId=null;S.besked='';
    closeAll();history.replaceState(null,'',location.pathname+location.search);route();
  });
  var c=await k(function(){return sb.rpc('joy_sidinstallningar');});
  if(!c.error&&c.data)S.cfg=Object.assign({},DEF,c.data);
  sattNamn();
  var s=await k(function(){return sb.auth.getSession();});
  if(s.data&&s.data.session&&s.data.session.user)S.mejl=s.data.session.user.email;
  var pp=provKnapp(false);if(pp)$('#provplats').appendChild(pp);
  window.addEventListener('hashchange',route);
  route();
}
init();
})();
</script>
